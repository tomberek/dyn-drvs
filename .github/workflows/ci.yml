name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-builder-rpc-v0:
    name: Tests (builder-rpc-v0, via try-it-out/run-nix.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # Fetches/builds a pinned real NixOS/nix commit (see
      # try-it-out/patched-nix.nix's own header comment) -- no patched
      # fork, no meson build step. The fetch+build itself is a real Nix
      # build, cached by magic-nix-cache-action across runs the same as
      # anything else this workflow builds.
      - name: Verify run-nix.sh can fetch+build a working Nix
        run: ./try-it-out/run-nix.sh --version

      - name: Run nix/tests/run-tests.sh
        run: nix/tests/run-tests.sh

      - name: Run examples 01/02/03-graph-of-two/03-graph-of-three/03-graph-with-groups/03-graph-groupby-directory
        run: |
          nix build --extra-experimental-features "nix-command" \
            --no-link -f try-it-out/examples/02-fallback-ifd.nix
          ./try-it-out/run-nix.sh build --impure --no-link \
            -f try-it-out/examples/01-hello-dynamic-drv.nix
          ./try-it-out/run-nix.sh build --impure --no-link \
            -f try-it-out/examples/03-graph-of-two.nix
          ./try-it-out/run-nix.sh build --impure --no-link \
            -f try-it-out/examples/03-graph-of-three.nix
          ./try-it-out/run-nix.sh build --impure --no-link \
            -f try-it-out/examples/03-graph-with-groups.nix
          ./try-it-out/run-nix.sh build --impure --no-link \
            -f try-it-out/examples/03-graph-groupby-directory.nix

      - name: Run examples 05/06 (accelerate.mkAcceleratedStdenv, builder-rpc-v0)
        run: |
          ./try-it-out/run-nix.sh build --impure --no-link \
            -f try-it-out/examples/05-accelerate-stdenv.nix
          ./try-it-out/run-nix.sh build --impure --no-link \
            -f try-it-out/examples/06-accelerate-stdenv-module.nix

      - name: Run example 07 (accelerate.mkAcceleratedStdenv against real nixpkgs freetype)
        run: |
          ./try-it-out/run-nix.sh build --impure --no-link \
            -f try-it-out/examples/07-accelerate-real-package.nix accelerated
          ./try-it-out/run-nix.sh build --impure --no-link \
            -f try-it-out/examples/07-accelerate-real-package.nix patchOutput

      - name: small-lib-patch-rebuild.sh regression check
        run: ./try-it-out/benchmarks/small-lib-patch-rebuild.sh 10 300
