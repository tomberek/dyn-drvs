name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CACHIX_CACHE: dynamicderivations

jobs:
  test-builder-rpc-v0:
    name: Tests (builder-rpc-v0, via try-it-out/run-nix.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest (24.04) restricts unprivileged user-namespace
      # creation via AppArmor by default, which is exactly what Nix's
      # build sandbox needs -- every build against a diverted store
      # (this repo's own `--store "local?root=..."`, used throughout
      # `try-it-out/run-nix.sh`/`nix/tests/run-tests.sh` to avoid the
      # system nix-daemon's fixed experimental-features) fails outright
      # with "this system does not support the kernel namespaces that
      # are required for sandboxing, which is required for building in
      # a diverted store" -- confirmed this is a CI-environment
      # regression (a runner-image default change), not anything this
      # repo's own code controls; same root cause and same fix nixgg's
      # own CI already uses (see ~/nixgg/.github/workflows/smoke.yml).
      # Known, still-open upstream gap:
      # https://github.com/DeterminateSystems/nix-installer-action/issues/193.
      - name: Allow unprivileged user namespaces (Nix sandbox needs this on ubuntu-latest)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # `devshell-parity-test.sh`/`devshell-parity-smalllib-test.sh`/
          # `cross-mode-reuse.sh` connect to the AMBIENT system nix-daemon
          # directly (via `nix/lib/shim/devShell.nix`'s `Rpc`-mode
          # wrappers -- the whole point of that mode is running OUTSIDE
          # any sandbox/diverted-store), unlike `try-it-out/run-nix.sh`'s
          # own explicit `--extra-experimental-features` flags on a
          # SEPARATE patched-Nix + diverted store -- so the ambient
          # daemon itself needs `ca-derivations`/`dynamic-derivations`
          # enabled, which a per-invocation CLI flag can't retroactively
          # grant to an already-running daemon. Confirmed necessary by
          # direct reproduction: without this, `devshell-parity-test.sh`
          # failed with "experimental Nix feature 'ca-derivations' is
          # disabled."
          extra-conf: |
            extra-experimental-features = nix-command flakes ca-derivations dynamic-derivations recursive-nix

      # Pull-only, no token needed -- works for fork PRs too, since the
      # cache is public-readable (same cache `~/overlay`'s own CI already
      # pushes/pulls, `dynamicderivations.cachix.org` -- see that repo's
      # `.github/workflows/ci.yml`). Substitutes the fetched patched-Nix
      # build and any dyndrv-* example/check this repo has already built
      # before, cutting cold-CI time. Push (below) is separate and gated
      # on secret access.
      - uses: cachix/cachix-action@v15
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN || '' }}

      - uses: DeterminateSystems/magic-nix-cache-action@main

      # Fetches/builds a pinned real NixOS/nix commit (see
      # try-it-out/patched-nix.nix's own header comment) -- no patched
      # fork, no meson build step. The fetch+build itself is a real Nix
      # build, cached by magic-nix-cache-action across runs the same as
      # anything else this workflow builds.
      - name: Verify run-nix.sh can fetch+build a working Nix
        run: ./try-it-out/run-nix.sh --version

      # `rust/dyndrv-shim`'s own unit tests (the `render::cross_mode_tests`
      # module in particular -- the permanent regression suite for the
      # Rpc/Sandbox script-construction parity `docs/rust-status.md`'s
      # "Cross-mode substitution" section describes) had NO CI coverage
      # at all before this step; a plain `nix shell nixpkgs#cargo
      # nixpkgs#rustc nixpkgs#gcc --command cargo test` is enough -- its
      # `harmonia-*`/`nix-builder-rpc-client` deps are real `git`
      # dependencies (see Cargo.toml's own header comment), which cargo
      # fetches itself; no vendor-copy/postPatch step to worry about here.
      - name: Run rust/dyndrv-shim's cargo test suite
        run: |
          nix shell nixpkgs#cargo nixpkgs#rustc nixpkgs#gcc \
            --command cargo test --manifest-path rust/dyndrv-shim/Cargo.toml

      - name: Run nix/tests/run-tests.sh
        run: nix/tests/run-tests.sh

      # Each of these is a real `checks.<system>.<name>` flake output
      # (`flake.nix`) -- what used to be individual `run-nix.sh build -f
      # <file>` shell lines are now `nix build .#checks.x86_64-linux.
      # <name>` targets, built through the SAME `run-nix.sh` wrapper
      # (patched Nix + isolated alt store + `builder-rpc-v0`/dynamic-
      # derivations feature flags), just pointed at a flake attr path
      # instead of `-f <file>`. `example-02` doesn't strictly need
      # `run-nix.sh`'s own `builder-rpc-v0` wrapping (it's designed to
      # work on stock Nix), but running it through the same loop is
      # harmless and keeps this step uniform. `example-17`/`-18`/`-19`/
      # `-20`/`-21`/`-22`/`-23`/`-24`/`-25` are the regression fixtures
      # for the cwd-relative-path-frame mismatch, CMake compiler-flag-
      # probe passthrough, `autoreconfHook` phase-dropping, `finalAttrs.
      # finalPackage`, compile+link-in-one-step header discovery,
      # `-MT`/`-MF` argv-shape misclassification, `ar`/`ranlib` probe-
      # invocation crashes, cmake+make's own out-of-tree install
      # failure, and `ar`'s own real store-path inputs never wired as
      # derivation deps, respectively -- see each fixture's own header
      # comment.
      - name: Run example checks (01/02/03-graph-*/05/06/07/17/18/19/20/21/22/23/24/25)
        run: |
          for check in example-01 example-02 example-03-graph-of-two \
            example-03-graph-of-three example-03-graph-with-groups \
            example-03-graph-groupby-directory example-05 example-06 \
            example-07-accelerated example-07-patch-output \
            example-17 example-18 example-19 example-20 example-21 example-22 example-23 example-24 example-25; do
            ./try-it-out/run-nix.sh build --impure --no-link \
              --print-out-paths ".#checks.x86_64-linux.$check"
          done

      - name: small-lib-patch-rebuild.sh regression check
        run: ./try-it-out/benchmarks/small-lib-patch-rebuild.sh 10 300

      - name: devshell-parity-test.sh (Rpc-vs-Sandbox drv-hash parity, real project)
        run: ./rust/dyndrv-shim/devshell-parity-test.sh

      - name: devshell-parity-smalllib-test.sh (Rpc-vs-Sandbox drv-hash parity, 2nd fixture)
        run: ./rust/dyndrv-shim/devshell-parity-smalllib-test.sh

      - name: cross-mode-reuse.sh (proves real substitution, not just hash agreement)
        run: ./rust/dyndrv-shim/cross-mode-reuse.sh

      # Pushes the ONE thing this job builds against the AMBIENT store
      # (not the isolated `$DYNDRV_STORE`): the fetched+built patched-Nix
      # itself (`try-it-out/patched-nix.nix`, resolved via a plain `nix
      # build` inside `try-it-out/run-nix.sh` before it ever re-execs
      # into the diverted store -- see that script's own header comment).
      # This is the single most expensive, most cache-worthy build in
      # this whole workflow (a full NixOS/nix checkout). Every OTHER
      # derivation this job builds (every `dyndrv-*`/`example-*` check)
      # only ever exists inside `$DYNDRV_STORE`'s own on-disk layout
      # (`$DYNDRV_STORE/nix/store/...`, never plain `/nix/store/...`) --
      # confirmed by direct reproduction that `cachix push` cannot read
      # those at all, regardless of `NIX_REMOTE`: it does a raw
      # filesystem `stat` on the plain `/nix/store/<hash>-...` path
      # (unlike `nix-store`/`nix`, which respect `NIX_REMOTE`'s
      # `root=`), so it fails with "pathIsSymbolicLink: does not exist"
      # for anything that only exists under the diverted root. Gated on
      # secret access (same pattern `~/overlay`'s own CI already uses)
      # so a fork PR -- which never has repo secrets -- skips this step
      # instead of failing on a missing token.
      - name: Push patched-nix to Cachix
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [[ -z "${CACHIX_AUTH_TOKEN:-}" ]]; then
            echo "No CACHIX_AUTH_TOKEN secret configured -- skipping push."
            exit 0
          fi
          SYSTEM=$(nix config show --json | jq -r .system.value)
          OUT=$(nix build --no-link --print-out-paths \
            --argstr system "$SYSTEM" \
            -f try-it-out/patched-nix.nix '^*' || true)
          [[ -n "$OUT" ]] && echo "$OUT" | cachix push "$CACHIX_CACHE"
