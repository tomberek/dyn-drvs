name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CACHIX_CACHE: dynamicderivations

jobs:
  test-builder-rpc-v0:
    name: Tests (builder-rpc-v0, via try-it-out/run-nix.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest (24.04) restricts unprivileged user-namespace
      # creation via AppArmor by default, which is exactly what Nix's
      # build sandbox needs -- every build against a diverted store
      # (this repo's own `--store "local?root=..."`, used throughout
      # `try-it-out/run-nix.sh`/`nix/tests/run-tests.sh` to avoid the
      # system nix-daemon's fixed experimental-features) fails outright
      # with "this system does not support the kernel namespaces that
      # are required for sandboxing, which is required for building in
      # a diverted store" -- confirmed this is a CI-environment
      # regression (a runner-image default change), not anything this
      # repo's own code controls; same root cause and same fix nixgg's
      # own CI already uses (see ~/nixgg/.github/workflows/smoke.yml).
      # Known, still-open upstream gap:
      # https://github.com/DeterminateSystems/nix-installer-action/issues/193.
      - name: Allow unprivileged user namespaces (Nix sandbox needs this on ubuntu-latest)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # `devshell-parity-test.sh`/`devshell-parity-smalllib-test.sh`/
          # `cross-mode-reuse.sh` connect to the AMBIENT system nix-daemon
          # directly (via `nix/lib/shim/devShell.nix`'s `Rpc`-mode
          # wrappers -- the whole point of that mode is running OUTSIDE
          # any sandbox/diverted-store), unlike `try-it-out/run-nix.sh`'s
          # own explicit `--extra-experimental-features` flags on a
          # SEPARATE patched-Nix + diverted store -- so the ambient
          # daemon itself needs `ca-derivations`/`dynamic-derivations`
          # enabled, which a per-invocation CLI flag can't retroactively
          # grant to an already-running daemon. Confirmed necessary by
          # direct reproduction: without this, `devshell-parity-test.sh`
          # failed with "experimental Nix feature 'ca-derivations' is
          # disabled."
          extra-conf: |
            extra-experimental-features = nix-command flakes ca-derivations dynamic-derivations recursive-nix

      # Pull-only, no token needed -- works for fork PRs too, since the
      # cache is public-readable (same cache `~/overlay`'s own CI already
      # pushes/pulls, `dynamicderivations.cachix.org` -- see that repo's
      # `.github/workflows/ci.yml`). Substitutes the fetched patched-Nix
      # build and any dyndrv-* example/check this repo has already built
      # before, cutting cold-CI time. Push (below) is separate and gated
      # on secret access.
      - uses: cachix/cachix-action@v15
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN || '' }}

      - uses: DeterminateSystems/magic-nix-cache-action@main

      # Fetches/builds a pinned real NixOS/nix commit (see
      # try-it-out/patched-nix.nix's own header comment) -- no patched
      # fork, no meson build step. The fetch+build itself is a real Nix
      # build, cached by magic-nix-cache-action across runs the same as
      # anything else this workflow builds.
      - name: Verify run-nix.sh can fetch+build a working Nix
        run: ./try-it-out/run-nix.sh --version

      # `rust/dyndrv-shim`'s own unit tests (the `render::cross_mode_tests`
      # module in particular -- the permanent regression suite for the
      # Rpc/Sandbox script-construction parity `docs/rust-status.md`'s
      # "Cross-mode substitution" section describes) had NO CI coverage
      # at all before this step; a plain `nix shell nixpkgs#cargo
      # nixpkgs#rustc nixpkgs#gcc --command cargo test` is enough -- its
      # `harmonia-*`/`nix-builder-rpc-client` deps are real `git`
      # dependencies (see Cargo.toml's own header comment), which cargo
      # fetches itself; no vendor-copy/postPatch step to worry about here.
      - name: Run rust/dyndrv-shim's cargo test suite
        run: |
          nix shell nixpkgs#cargo nixpkgs#rustc nixpkgs#gcc \
            --command cargo test --manifest-path rust/dyndrv-shim/Cargo.toml

      - name: Run nix/tests/run-tests.sh
        run: nix/tests/run-tests.sh

      - name: small-lib-patch-rebuild.sh regression check
        run: ./try-it-out/benchmarks/small-lib-patch-rebuild.sh 10 300

      - name: devshell-parity-test.sh (Rpc-vs-Sandbox drv-hash parity, real project)
        run: ./rust/dyndrv-shim/devshell-parity-test.sh

      - name: devshell-parity-smalllib-test.sh (Rpc-vs-Sandbox drv-hash parity, 2nd fixture)
        run: ./rust/dyndrv-shim/devshell-parity-smalllib-test.sh

      - name: cross-mode-reuse.sh (proves real substitution, not just hash agreement)
        run: ./rust/dyndrv-shim/cross-mode-reuse.sh

      # Pushes the ONE thing this job builds against the AMBIENT store
      # (not the isolated `$DYNDRV_STORE`): the fetched+built patched-Nix
      # itself (`try-it-out/patched-nix.nix`, resolved via a plain `nix
      # build` inside `try-it-out/run-nix.sh` before it ever re-execs
      # into the diverted store -- see that script's own header comment),
      # PLUS the flake's own `.#default` output (`flake.nix`'s
      # `packages.<system>.default` -- a thin `writeShellScriptBin`
      # wrapper around that SAME patched-Nix build, the one thing the
      # "Comment trynix.dev preview link" step below actually boots).
      # This is the single most expensive, most cache-worthy build in
      # this whole workflow (a full NixOS/nix checkout). Every OTHER
      # derivation this job builds (every `dyndrv-*`/`example-*` check)
      # only ever exists inside `$DYNDRV_STORE`'s own on-disk layout
      # (`$DYNDRV_STORE/nix/store/...`, never plain `/nix/store/...`) --
      # confirmed by direct reproduction that `cachix push` cannot read
      # those at all, regardless of `NIX_REMOTE`: it does a raw
      # filesystem `stat` on the plain `/nix/store/<hash>-...` path
      # (unlike `nix-store`/`nix`, which respect `NIX_REMOTE`'s
      # `root=`), so it fails with "pathIsSymbolicLink: does not exist"
      # for anything that only exists under the diverted root. Gated on
      # secret access (same pattern `~/overlay`'s own CI already uses)
      # so a fork PR -- which never has repo secrets -- skips this step
      # instead of failing on a missing token.
      - name: Push patched-nix to Cachix
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [[ -z "${CACHIX_AUTH_TOKEN:-}" ]]; then
            echo "No CACHIX_AUTH_TOKEN secret configured -- skipping push."
            exit 0
          fi
          SYSTEM=$(nix config show --json | jq -r .system.value)
          OUT=$(nix build --no-link --print-out-paths \
            --argstr system "$SYSTEM" \
            -f try-it-out/patched-nix.nix '^*' || true)
          [[ -n "$OUT" ]] && echo "$OUT" | cachix push "$CACHIX_CACHE"
          DEFAULT_OUT=$(nix build --no-link --print-out-paths .#default || true)
          [[ -n "$DEFAULT_OUT" ]] && echo "$DEFAULT_OUT" | cachix push "$CACHIX_CACHE"

      # Comments a trynix.dev link on the PR that boots `.#default`
      # (the patched-Nix wrapper script from `try-it-out/patched-nix.nix`
      # -- see that file's own header comment, and this workflow's
      # "Push patched-nix to Cachix" step just above) directly in the
      # reviewer's browser -- "a reviewer runs the branch in a tab
      # instead of checking it out" (fzakaria/trynix's own README).
      # `build: false` (the default): the browser only needs the store
      # PATHS to exist in the cache, which the push step above already
      # guarantees whenever `CACHIX_AUTH_TOKEN` is configured -- no
      # second, duplicate build here. `verify: warn` (also the default):
      # a fork PR's push step above skips (no repo secret), so this
      # step would otherwise warn on every fork PR that the cache lacks
      # the path -- acceptable, matches this workflow's own existing
      # "skip gracefully without secrets" pattern elsewhere. Only makes
      # sense on `pull_request` (it comments on a PR; a plain `push` to
      # `master` has no PR to comment on).
      - name: Comment trynix.dev preview link
        if: ${{ github.event_name == 'pull_request' }}
        uses: fzakaria/trynix@v1
        with:
          cache: https://${{ env.CACHIX_CACHE }}.cachix.org
          publicKey: dynamicderivations.cachix.org-1:AmDuQASmWJsVYB/r0TGTZnQSnoxPzKP8ijfGw/6aT3k=
          attrs: .#default

  # Each of these is a real `checks.<system>.<name>` flake output
  # (`flake.nix`) -- what used to be individual `run-nix.sh build -f
  # <file>` shell lines are now `nix build .#checks.x86_64-linux.
  # <name>` targets, built through the SAME `run-nix.sh` wrapper
  # (patched Nix + isolated alt store + `builder-rpc-v0`/dynamic-
  # derivations feature flags), just pointed at a flake attr path
  # instead of `-f <file>`. `example-02` doesn't strictly need
  # `run-nix.sh`'s own `builder-rpc-v0` wrapping (it's designed to
  # work on stock Nix), but running it through the same loop is
  # harmless and keeps this step uniform. `example-17` through
  # `-29` plus `-31`/`-32`/`-33`/`-34`/`-35`/`-36`/`-37` are the
  # regression fixtures for the cwd-relative-path-frame mismatch,
  # CMake compiler-flag-probe passthrough, `autoreconfHook`
  # phase-dropping, `finalAttrs.finalPackage`, compile+link-in-one-step
  # header discovery, `-MT`/`-MF` argv-shape misclassification, `ar`/
  # `ranlib` probe-invocation crashes, cmake+make's own out-of-tree
  # install failure, `ar`'s own real store-path inputs never wired as
  # derivation deps, a `-Wl,`-glued flag's own embedded path never
  # unglued before computing its output directory,
  # `dyndrvRestoreOutput` running too late for a `postInstall` that
  # reads/writes `$out` directly, `ar`/`ranlib` probes with a
  # non-`-`-prefixed positional value elsewhere in argv, multi-
  # output restore never redistributing ordinary `bin`/`lib`
  # content, `__structuredAttrs = true` silently defeating
  # `sandboxedDrv`'s own `out = dyndrvPlaceholderOut` override,
  # cmake's `install(EXPORT ...)` baking that same literal
  # placeholder path into a generated target-import file's
  # `_IMPORT_PREFIX`, meson's own `testfile.<suffix>`-named
  # compiler-check probes not being recognized as passthrough-
  # eligible, a literal `outputBin`/`outputMan`/`outputDev`
  # override inherited from the caller crashing phase 1 setup
  # outright, automake's classic depcomp `-MF <depfile>`
  # side-output never round-tripping back out of a deferred
  # compile, a bare `-l<name>` link argument never resolved
  # against its own relative `-L<dir>` search path, and a sibling
  # build directory (created by a `preConfigure`/`preBuild` hook
  # before the main build dir) never scanned for stubs at all,
  # respectively -- see each fixture's own header comment.
  #
  # Split into a 4-way matrix (one job per bucket, ~7-8 checks each)
  # rather than one long serial step in the main job above -- confirmed
  # via a real CI run (35088740748) that all ~30 checks together took
  # ~7 of this workflow's ~14 total minutes, entirely serial. Each
  # bucket pays its own toolchain-fetch/build setup cost independently
  # (checkout, apparmor sysctl, nix-installer, cachix/magic-nix-cache
  # pull) -- a real, deliberate trade-off: total COMPUTE goes up
  # (setup duplicated across buckets instead of paid once), but WALL-
  # CLOCK for this part of the workflow drops, since buckets run
  # concurrently instead of one 30-check queue -- capped to at most 2
  # buckets at a time (`max-parallel: 2` on the job below), not all 4,
  # to avoid a real, confirmed regression -- see that setting's own
  # comment. `fail-fast: false` so one bucket's failure doesn't cancel
  # the others mid-run -- keeps the SAME "learn about every failure in
  # one CI round-trip" property the collect-and-report step below
  # already established, just extended across job boundaries instead
  # of within one step. `cachix-action`'s own pull (populated by
  # whichever job/run built a given `dyndrv-*`/`example-*` output
  # first) means a bucket's own checks substitute instead of
  # rebuilding wherever a previous run already produced them,
  # softening the setup-duplication cost over time.
  example-checks:
    name: Example checks (bucket ${{ matrix.bucket }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # `max-parallel: 2`: confirmed necessary by direct reproduction
      # (CI run 35155121929) -- all 4 buckets running concurrently
      # alongside the main job (5 jobs total) hit GitHub's own Actions
      # Cache API rate limit for `magic-nix-cache-action`: "GitHub
      # Actions Cache throttled Magic Nix Cache. Not trying to use it
      # again on this run." That substituter then stays PERMANENTLY
      # disabled for the rest of that job's run (not just retried
      # later), cascading into real build failures wherever a later
      # step in the SAME job needed a path only that cache had --
      # confirmed this took down both a matrix bucket's own example
      # check AND, independently, the main job's `devshell-parity-
      # test.sh` step in the same run. Capping concurrency to 2 halves
      # the peak number of simultaneous cache-API callers (main job +
      # at most 2 buckets, vs. main job + all 4) -- softens the
      # parallelism win from ~4x to ~2x for this part of the workflow,
      # but that's the actual trade-off this fixes: unthrottled
      # concurrency was never really 4x in practice, since the
      # throttle-triggered cascade cost more wall-clock (via retries/
      # cache-miss rebuilds) than the parallelism saved.
      max-parallel: 2
      matrix:
        include:
          - bucket: 1
            checks: >-
              example-01 example-02 example-03-graph-of-two
              example-03-graph-of-three example-03-graph-with-groups
              example-03-graph-groupby-directory example-05 example-06
          - bucket: 2
            checks: >-
              example-07-accelerated example-07-patch-output
              example-17 example-18 example-19 example-20 example-21
          - bucket: 3
            checks: >-
              example-22 example-23 example-24 example-25 example-26
              example-27 example-28
          - bucket: 4
            checks: >-
              example-29 example-31 example-32 example-33 example-34
              example-35 example-36 example-37
    steps:
      - uses: actions/checkout@v4

      # Same AppArmor workaround as the main job above -- see that
      # step's own comment for the full "why" (each matrix job is its
      # own fresh runner, so this needs to be repeated per-bucket, not
      # just once for the whole workflow).
      - name: Allow unprivileged user namespaces (Nix sandbox needs this on ubuntu-latest)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-experimental-features = nix-command flakes ca-derivations dynamic-derivations recursive-nix

      - uses: cachix/cachix-action@v15
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN || '' }}

      - uses: DeterminateSystems/magic-nix-cache-action@main

      # Same collect-and-report pattern the pre-matrix single step used
      # -- see the header comment above this job for why the checks are
      # split into buckets in the first place; this per-bucket loop
      # itself still runs every one of ITS OWN checks regardless of an
      # earlier one's failure, so a bucket's own step summary always
      # shows the full pass/fail/timing picture for its checks, not
      # just the first failure.
      - name: Run example checks
        run: |
          checks=(${{ matrix.checks }})
          {
            echo "## Example checks (bucket ${{ matrix.bucket }})"
            echo
            echo "| Check | Result | Time |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=()
          for check in "${checks[@]}"; do
            start=$(date +%s)
            if ./try-it-out/run-nix.sh build --impure --no-link \
                --print-out-paths ".#checks.x86_64-linux.$check"; then
              result="✅ pass"
            else
              result="❌ FAIL"
              failed+=("$check")
            fi
            elapsed=$(( $(date +%s) - start ))
            echo "| $check | $result | ${elapsed}s |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo
            echo "Failed checks: ${failed[*]}"
            exit 1
          fi

