[package]
name = "nix-builder-rpc-client"
version = "0.1.0"
edition = "2021"
description = "Client for the Nix daemon's builder-rpc-v0 mode (NixOS/nix#15793)"
license = "MIT"

[dependencies]
anyhow = "1.0"
futures = "0.3"
harmonia-protocol = { path = "../harmonia/harmonia-protocol" }
harmonia-store-aterm = { path = "../harmonia/harmonia-store-aterm" }
harmonia-store-content-address = { path = "../harmonia/harmonia-store-content-address" }
harmonia-store-derivation = { path = "../harmonia/harmonia-store-derivation" }
harmonia-store-path = { path = "../harmonia/harmonia-store-path" }
harmonia-store-remote = { path = "../harmonia/harmonia-store-remote" }
harmonia-utils-hash = { path = "../harmonia/harmonia-utils-hash" }
nix-nar = "0.3"
thiserror = "1"
tokio = { version = "1", features = ["rt", "io-util", "net", "sync", "macros"] }
